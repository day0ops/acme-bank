# built via: docker build -f services/notifications/Dockerfile . (run from repo root)
image:
  repository: acme-bank/notifications
  tag: latest
replicaCount: 1
env:
  kafkaBootstrapServers: "redpanda.acme-platform.svc.cluster.local:9092"
  jwksUrl: "http://keycloak.acme-platform.svc.cluster.local:8080/realms/acme-bank/protocol/openid-connect/certs"
  otelExporterEndpoint: "http://otel-collector.acme-platform.svc.cluster.local:4317"
