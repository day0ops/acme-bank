# built via: docker build -f services/fraud-risk/Dockerfile . (run from repo root)
image:
  repository: acme-bank/fraud-risk
  tag: latest
replicaCount: 1
env:
  databaseURL: "jdbc:postgresql://fraud-risk-postgres:5432/fraud_risk"
  databaseUser: "fraud_risk"
  databasePassword: "fraud_risk"
  kafkaBootstrapServers: "redpanda.acme-platform.svc.cluster.local:9092"
  jwksUrl: "http://keycloak.acme-platform.svc.cluster.local:8080/realms/acme-bank/protocol/openid-connect/certs"
  otelExporterEndpoint: "otel-collector.acme-platform.svc.cluster.local:4317"
