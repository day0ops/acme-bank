apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-risk
  labels:
    app: fraud-risk
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: fraud-risk
  template:
    metadata:
      labels:
        app: fraud-risk
    spec:
      containers:
        - name: fraud-risk
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              value: {{ .Values.env.databaseURL | quote }}
            - name: DATABASE_USER
              value: {{ .Values.env.databaseUser | quote }}
            - name: DATABASE_PASSWORD
              value: {{ .Values.env.databasePassword | quote }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.env.kafkaBootstrapServers | quote }}
            - name: JWKS_URL
              value: {{ .Values.env.jwksUrl | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.otelExporterEndpoint | quote }}
