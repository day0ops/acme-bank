# built via: docker build -f services/dashboard-bff/Dockerfile . (run from repo root)
image:
  repository: acme-bank/dashboard-bff
  tag: latest
replicaCount: 1
env:
  customersGrpcAddr: "customers.acme-bank.svc.cluster.local:9090"
  accountsGrpcAddr: "accounts.acme-bank.svc.cluster.local:9090"
  cardsGrpcAddr: "cards.acme-bank.svc.cluster.local:9090"
  transactionsGrpcAddr: "transactions.acme-bank.svc.cluster.local:9090"
  jwksUrl: "http://keycloak.acme-platform.svc.cluster.local:8080/realms/acme-bank/protocol/openid-connect/certs"
  otelExporterEndpoint: "otel-collector.acme-platform.svc.cluster.local:4317"
