# Helm's .Files.Get is restricted to the chart's own directory tree and
# silently returns empty for paths outside it (verified: no error, just a
# blank value) - so this reads a chart-local copy of the realm export rather
# than the canonical platform/keycloak/realm-export.json directly. Keep the
# two in sync; see platform/keycloak/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
data:
  realm-export.json: |
{{ .Files.Get "files/realm-export.json" | indent 4 }}
