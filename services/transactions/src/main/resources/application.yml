spring:
  application:
    name: transactions
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/transactions}
    username: ${DATABASE_USER:transactions}
    password: ${DATABASE_PASSWORD:transactions}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URL:http://keycloak.acme-platform.svc.cluster.local:8080/realms/acme-bank/protocol/openid-connect/certs}

server:
  port: 8080

grpc:
  port: 9090

accounts:
  grpc:
    host: ${ACCOUNTS_GRPC_HOST:localhost}
    port: ${ACCOUNTS_GRPC_PORT:9090}

otel:
  exporter:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}
