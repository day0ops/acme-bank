spring:
  application:
    name: fraud-risk
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URL:http://keycloak.acme-platform.svc.cluster.local:8080/realms/acme-bank/protocol/openid-connect/certs}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fraud_risk}
    username: ${DATABASE_USER:fraud_risk}
    password: ${DATABASE_PASSWORD:fraud_risk}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-risk
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

server:
  port: 8080

otel:
  exporter:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}
