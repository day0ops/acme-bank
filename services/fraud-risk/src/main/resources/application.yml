spring:
  application:
    name: fraud-risk
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fraud_risk}
    username: ${DATABASE_USER:fraud_risk}
    password: ${DATABASE_PASSWORD:fraud_risk}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

server:
  port: 8080

otel:
  exporter:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}
