spring:
  application:
    name: customers
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/customers}
    username: ${DATABASE_USER:customers}
    password: ${DATABASE_PASSWORD:customers}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: always
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URL:http://keycloak.acme-platform.svc.cluster.local:8080/realms/acme-bank/protocol/openid-connect/certs}

server:
  port: 8080

grpc:
  port: 9090

otel:
  exporter:
    endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:localhost:4317}
