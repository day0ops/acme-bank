apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-ui
  namespace: acme-bank
spec:
  parentRefs:
    - name: acme-bank-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: customers-api
  namespace: acme-bank
spec:
  parentRefs:
    - name: acme-bank-gateway
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/customers }
      backendRefs:
        - name: customers
          port: 8080
---
